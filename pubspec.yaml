name: krishimitra
description: "KrishiMitra - AI crop health assistant for farmers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  tflite_flutter: ^0.12.1
  image: ^4.10.1
  http: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: any

flutter:
  uses-material-design: true

  assets:
    - assets/crop_diseases.json
    - assets/models/best_mobilenet.tflite
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FAFBF6"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
